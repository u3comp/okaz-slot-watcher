name: Okaz Slot Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - discord_test
          - diagnostic

permissions: {}

concurrency:
  group: okaz-slot-watcher
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.WATCHER_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      ended: ${{ steps.cutoff.outputs.ended }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check monitoring cutoff
        id: cutoff
        shell: bash
        run: python -m watcher.cli cutoff --github-output "$GITHUB_OUTPUT"

  watch:
    needs: gate
    if: ${{ needs.gate.outputs.ended != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WATCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run watcher
        run: python -m watcher.cli "$WATCH_MODE"

  disable-after-cutoff:
    needs: gate
    if: ${{ always() && needs.gate.result == 'success' && needs.gate.outputs.ended == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Disable this workflow permanently
        run: gh workflow disable availability-watcher.yml --repo "$GITHUB_REPOSITORY"
